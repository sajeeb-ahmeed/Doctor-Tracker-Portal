name: Visual QA screenshots (temporary)
on:
  push:
    branches:
      - ui/submission-ready-refinement-20261014
    paths:
      - .github/workflows/premium-visual-qa.yml
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run setup:local
      - name: Start local frontend and MongoDB-backed API
        run: |
          nohup npm run dev:all > /tmp/doctortracker-services.log 2>&1 &
          for i in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -120 /tmp/doctortracker-services.log
          exit 1
      - name: Capture real premium dashboard and login screenshots
        run: |
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 node tests/capture-screenshots.mjs
          node --input-type=module <<'EOF'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:3000/login');
          await page.locator('.login-form').waitFor();
          await page.screenshot({ path: 'docs/screenshots/login-premium-desktop.png', fullPage: true, animations: 'disabled' });
          await browser.close();
          EOF
      - name: Publish latest screenshots to the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/dashboard-desktop.png docs/screenshots/dashboard-mobile.png docs/screenshots/doctors-desktop.png docs/screenshots/patients-mobile.png docs/screenshots/login-premium-desktop.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh premium UI visual evidence"
            git push
          fi
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctortracker-premium-visual-qa
          path: docs/screenshots/*.png
          if-no-files-found: warn
