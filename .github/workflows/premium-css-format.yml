name: Premium CSS format pass
on:
  push:
    branches:
      - ui/submission-ready-refinement-20261014
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/premium-refinements.css
      - name: Commit formatting
        run: |
          if ! git diff --quiet -- app/premium-refinements.css; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/premium-refinements.css
            git commit -m "style: format premium theme with Prettier"
            git push
          fi
